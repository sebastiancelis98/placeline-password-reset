<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px;
    width: 100%;
    max-width: 380px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p.sub { color: #666; font-size: 14px; margin: 0 0 24px; }
  label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d0d0d5;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: #6366f1; }
  button {
    width: 100%;
    padding: 11px;
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #a5a5b0; cursor: not-allowed; }
  .message {
    margin-top: 16px;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 8px;
  }
  .message.error { background: #fef2f2; color: #b91c1c; }
  .message.success { background: #f0fdf4; color: #15803d; }
  .status { color: #666; font-size: 14px; text-align: center; }
</style>
</head>
<body>

<div class="card">
  <h1>Reset your password</h1>
  <p class="sub">Enter a new password for your account.</p>

  <div id="verifying" class="status">Verifying reset link…</div>

  <form id="resetForm" style="display:none;">
    <label for="password">New password</label>
    <input type="password" id="password" minlength="6" required placeholder="At least 6 characters" />

    <label for="confirm">Confirm password</label>
    <input type="password" id="confirm" minlength="6" required placeholder="Re-enter password" />

    <button type="submit" id="submitBtn">Update password</button>
  </form>

  <div id="messageBox"></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  // ---- CONFIGURE THESE TWO VALUES ----
  const SUPABASE_URL = 'https://cklnhvdqwimhahgqpzwz.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_KxGsyJSUvAD67MIVrB9MZw_4_zZz';
  // -------------------------------------

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const verifying = document.getElementById('verifying');
  const form = document.getElementById('resetForm');
  const messageBox = document.getElementById('messageBox');
  const submitBtn = document.getElementById('submitBtn');

  function showMessage(text, type) {
    messageBox.innerHTML = `<div class="message ${type}">${text}</div>`;
  }

  let sessionReady = false;

  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      sessionReady = true;
      verifying.style.display = 'none';
      form.style.display = 'block';
    }
  });

  // Fallback: if a session already exists when the page loads
  // (covers some PKCE/code-exchange timing cases)
  supabase.auth.getSession().then(({ data }) => {
    if (data.session && !sessionReady) {
      sessionReady = true;
      verifying.style.display = 'none';
      form.style.display = 'block';
    }
  });

  // If nothing fires within a few seconds, the link is likely invalid or expired
  setTimeout(() => {
    if (!sessionReady) {
      verifying.textContent = 'This reset link is invalid or has expired. Please request a new one.';
    }
  }, 4000);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (password !== confirm) {
      showMessage('Passwords do not match.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating…';

    const { error } = await supabase.auth.updateUser({ password });

    if (error) {
      showMessage(error.message, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update password';
    } else {
      showMessage('Password updated. You can close this page and log in.', 'success');
      form.style.display = 'none';
    }
  });
</script>

</body>
</html>
