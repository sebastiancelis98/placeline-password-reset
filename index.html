<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px;
    width: 100%;
    max-width: 380px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p.sub { color: #666; font-size: 14px; margin: 0 0 24px; }
  label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d0d0d5;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: #6366f1; }
  button {
    width: 100%;
    padding: 11px;
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #a5a5b0; cursor: not-allowed; }
  .message {
    margin-top: 16px;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 8px;
  }
  .message.error { background: #fef2f2; color: #b91c1c; }
  .message.success { background: #f0fdf4; color: #15803d; }
  .status { color: #666; font-size: 14px; text-align: center; }
</style>
</head>
<body>

<div class="card">
  <h1>Reset your password</h1>

  <!-- Step 1: explicit confirm button (avoids iOS Mail link-prefetch burning the token) -->
  <div id="confirmStep">
    <p class="sub">Click below to verify this is you and continue.</p>
    <button id="confirmBtn">Confirm and continue</button>
  </div>

  <!-- Step 2: new password form -->
  <form id="resetForm" style="display:none;">
    <p class="sub">Enter a new password for your account.</p>
    <label for="password">New password</label>
    <input type="password" id="password" minlength="6" required placeholder="At least 6 characters" />

    <label for="confirm">Confirm password</label>
    <input type="password" id="confirm" minlength="6" required placeholder="Re-enter password" />

    <button type="submit" id="submitBtn">Update password</button>
  </form>

  <div id="messageBox"></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  // ---- CONFIGURE THESE TWO VALUES ----
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
  // -------------------------------------

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const confirmStep = document.getElementById('confirmStep');
  const confirmBtn = document.getElementById('confirmBtn');
  const form = document.getElementById('resetForm');
  const messageBox = document.getElementById('messageBox');
  const submitBtn = document.getElementById('submitBtn');

  function showMessage(text, type) {
    messageBox.innerHTML = `<div class="message ${type}">${text}</div>`;
  }

  const params = new URLSearchParams(window.location.search);
  const tokenHash = params.get('token_hash');
  const type = params.get('type') || 'recovery';

  if (!tokenHash) {
    confirmStep.style.display = 'none';
    showMessage('This reset link is missing required info. Please request a new one.', 'error');
  }

  confirmBtn.addEventListener('click', async () => {
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Verifying…';

    const { error } = await supabase.auth.verifyOtp({
      token_hash: tokenHash,
      type,
    });

    if (error) {
      showMessage(
        'This reset link is invalid or has expired. Please request a new one.',
        'error'
      );
      confirmStep.style.display = 'none';
    } else {
      confirmStep.style.display = 'none';
      form.style.display = 'block';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (password !== confirm) {
      showMessage('Passwords do not match.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating…';

    const { error } = await supabase.auth.updateUser({ password });

    if (error) {
      showMessage(error.message, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update password';
    } else {
      showMessage('Password updated. You can close this page and log in.', 'success');
      form.style.display = 'none';
    }
  });
</script>

</body>
</html>
